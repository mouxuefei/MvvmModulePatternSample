plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
}
android {
    compileSdkVersion 29
    buildToolsVersion "30.0.2"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1000
        versionName "1000"
    }
    dataBinding {
        enabled = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.5.0"
    api "androidx.appcompat:appcompat:1.0.0"
    api "androidx.legacy:legacy-support-v4:1.0.0"
    api "com.google.android.material:material:1.0.0"
    api "androidx.recyclerview:recyclerview:1.2.0"
    api "androidx.annotation:annotation:1.0.0"

    //mvvm
    kapt "androidx.lifecycle:lifecycle-compiler:2.3.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.3.0"

    //rxjava
    api "io.reactivex.rxjava2:rxandroid:2.0.2"
    api "io.reactivex.rxjava2:rxjava:2.1.12"
    api "com.uber.autodispose:autodispose:0.8.0"
    api "com.uber.autodispose:autodispose-android-archcomponents:0.8.0"

    //network
    api "com.squareup.retrofit2:retrofit:2.4.0"
    api "com.squareup.retrofit2:converter-gson:2.4.0"
    api "com.squareup.retrofit2:adapter-rxjava2:2.4.0"
    api "com.squareup.okhttp3:okhttp:3.10.0"
    api "com.squareup.okhttp3:logging-interceptor:3.9.0"
    api "com.github.bumptech.glide:glide:4.5.0"
    api "jp.wasabeef:glide-transformations:2.0.1"
    api "com.google.code.gson:gson:2.8.2"
    api "com.github.franmontiel:PersistentCookieJar:v1.0.1"

    //tools
    api "com.orhanobut:logger:2.2.0"
    api 'androidx.multidex:multidex:2.0.0'
    api "com.blankj:utilcodex:1.31.0"
}
