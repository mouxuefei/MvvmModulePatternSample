plugins {
    id 'com.android.library'
}

android {

    namespace "top.zibin.luban" // 新版必须指定
    compileSdk project.properties['TARGET_SDK'].toInteger()

    defaultConfig {
        minSdkVersion project.properties['MIN_SDK'].toInteger()
        targetSdk project.properties['TARGET_SDK'].toInteger()

        consumerProguardFiles "consumer-rules.pro"
    }
    buildFeatures {
        buildConfig = true
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}



dependencies {}