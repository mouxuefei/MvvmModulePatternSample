plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'kotlin-parcelize'
}

android {
    namespace "com.mou.mvvmmodule" // 新版必须指定
    compileSdk 34
    defaultConfig {
        minSdkVersion 21
        targetSdk 34
        versionCode 1000
        versionName "1000"
        multiDexEnabled true
        ndk { //设置支持的SO库架构（开发者可以根据需要，选择一个或多个平台的so）
            abiFilters "armeabi", "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    signingConfigs {
        debug {
            keyAlias 'key'
            keyPassword '123456'
            storeFile file("./mvvm.jks")
            storePassword '123456'
        }
        release {
            keyAlias 'key'
            keyPassword '123456'
            storeFile file("./mvvm.jks")
            storePassword '123456'
        }
    }


    buildTypes {
        debug {
            buildConfigField "boolean", "LOG_DEBUG", "true"
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        release {
            buildConfigField "boolean", "LOG_DEBUG", "false"
            //是否开启混淆
            minifyEnabled false
            // 移除无用的resource文件
            shrinkResources false
            // Zipalign优化
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

//开启databinding
    dataBinding {
        enabled = false
    }

//生成libs目录
    sourceSets {
        main.jniLibs.srcDirs = ['libs']
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
        textReport = false
        textOutput = file("lint-report.txt")
        // 可选：配置报告类型
        htmlReport = true
        htmlOutput = file("$buildDir/reports/lint/lint.html")
    }


}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"
    implementation project(':core_common')
    implementation project(':core_network')
    implementation project(':feature_im')
    implementation project(':feature_business')
    implementation project(':feature_ai')
}