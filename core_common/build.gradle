plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'kotlin-parcelize'
}
android {
    namespace "com.core.commonsdk"
    compileSdk project.properties['TARGET_SDK'].toInteger()
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    defaultConfig {
        minSdkVersion project.properties['MIN_SDK'].toInteger()
        targetSdk project.properties['TARGET_SDK'].toInteger()
        versionCode project.properties['APP_VERSION_CODE'].toInteger()
        versionName project.properties['APP_VERSION_NAME']
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }


    dataBinding {
        enabled = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    api project(':core_mvvm')


}
