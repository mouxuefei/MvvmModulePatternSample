plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}
android {
    namespace "com.fortunes.commonsdk"
    compileSdk 34
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    defaultConfig {
        minSdkVersion 21
        targetSdk 34
        versionCode 1000
        versionName "1000"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }



    dataBinding {
        enabled = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"
    api project(':lib_basemvvm')
    api "androidx.cardview:cardview:1.0.0"
    api "io.github.scwang90:refresh-layout-kernel:2.0.5"
    api "io.github.scwang90:refresh-header-classics:2.0.5"

    api "com.flyco.tablayout:FlycoTabLayout_Lib:2.1.2@aar"
    api "com.gyf.immersionbar:immersionbar:2.3.1"
    api "com.contrarywind:Android-PickerView:4.1.6"
    api ("com.github.LuckSiege.PictureSelector:picture_library:v2.6.1") {
        exclude module: 'glide'
    }
    api("com.airbnb.android:lottie:2.7.0") {
        exclude module: 'support'
    }

    kapt "androidx.lifecycle:lifecycle-compiler:2.9.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.9.2"

    api "com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.7"
}
