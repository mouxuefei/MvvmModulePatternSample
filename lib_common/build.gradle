plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-android-extensions'
}
android {

    compileSdkVersion rootProject.ext.android["compileSdkVersion"]
    buildToolsVersion rootProject.ext.android["buildToolsVersion"]

    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion rootProject.ext.android["minSdkVersion"]
        targetSdkVersion rootProject.ext.android["targetSdkVersion"]
        versionCode rootProject.ext.android["versionCode"]
        versionName rootProject.ext.android["versionName"]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    //支持@Parcelize来实现Parcelable序列化
    androidExtensions {
        experimental = true
    }

    dataBinding {
        enabled = true
    }
}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${versions["kotlin_version"]}"
    api project(':lib_basemvvm')
    api "androidx.cardview:cardview:${versions["appcompatVersion"]}"
    api "io.github.scwang90:refresh-layout-kernel:2.0.5"
    api "io.github.scwang90:refresh-header-classics:2.0.5"

    api "com.flyco.tablayout:FlycoTabLayout_Lib:2.1.2@aar"
    api "com.gyf.immersionbar:immersionbar:2.3.1"
    api "com.contrarywind:Android-PickerView:4.1.6"
    api ("com.github.LuckSiege.PictureSelector:picture_library:v2.6.1") {
        exclude module: 'glide'
    }
    api("com.airbnb.android:lottie:2.7.0") {
        exclude module: 'support'
    }

    kapt "androidx.lifecycle:lifecycle-compiler:${versions["lifeVersion"]}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${versions["lifeVersion"]}"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:${versions["lifeVersion"]}"

    api "com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.7"
}
